server:
  port: ${SERVER_PORT:8081}
spring:
  application: {name: auth-service}

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:microservices-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:app-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  admin-user: ${KEYCLOAK_ADMIN_USER:kcadmin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:kcadmin-pass}
  app-admin-username: ${APP_ADMIN_USERNAME:admin}
  app-admin-password: ${APP_ADMIN_PASSWORD:admin123}

management:
  endpoints.web.exposure.include: health,info