apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-user
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-user
  template:
    metadata:
      labels:
        app: redis-user
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-user
  namespace: microservices
spec:
  selector:
    app: redis-user
  ports:
    - port: 6379

